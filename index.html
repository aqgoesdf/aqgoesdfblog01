<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AqGoEs | Dev</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Cabelaho-->
    <header>
        <nav class="navbar"> 
            <h1 class="logo">AqGoEs</h1>
            <ul class="menu">
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!--Seção hero-->
        <section id="sobre" class="hero">
            <h2> Desenvolvimento Web Profissional</h2>
            <p>Sites modernos, rápidos e responsivos</p>
            <button>Saiba mais...</button>
        </section>

        <!--Serviços-->
        <section id="servicos" class="servicos">    
            <h2>Serviços</h2>
            <!--Div principal do cards-->
            <div class="cards">
                <div class="card">Sites Institucionais</div>
                <div class="card">Landing Pages</div>
                <div class="card">Sistemas Web</div>
            </div>
        </section>

        <section id="contato" class="contato">
            <h2>Contato</h2>

            <form id="formContato">
                <input type="text" placeholder="Nome" required>
                <input type="text" placeholder="E-mail"
                required >
                <textarea placeholder="Mensagem"></textarea>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <!--Footer-->
    <footer>
        <p>@2026 - AqGoEs | Dev</p>
    </footer>

    <script src="js/scripts.js"></script>
</body>
</html>
