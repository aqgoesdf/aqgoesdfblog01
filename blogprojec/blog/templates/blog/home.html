{% extends 'blog/base.html' %}
{% block title %}
Página initial
{% endblock %}

{% block content %}

    <h2>Últimos Posts</h2>
    
    {% for post in posts %}
    <article>
        <h3>{{ post.titulo }}</h3>
        <p>{{ post.conteudo }}</p>
        <small>Publicado em: {{ post.data_criacao }}</small>
    </article>
 {% empty %}
    <p>Nenhum post encontrado.</p>
 {% endfor %}
{% endblock %}
