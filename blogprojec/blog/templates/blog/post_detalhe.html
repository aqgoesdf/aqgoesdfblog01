{% extends 'blog/base.html' %}
{% block title %}{{ post.titulo }}{% endblock %}

{% block content %}

<article class="detalhe_post">
    <h2>{{ post.titulo }}</h2>
    <small>Publicado em {{ post.data_criacao|date:"d/m/Y H:i" }}</small>

    <p>{{ post.conteudo }}</p>
</article>
<a href="{% url 'home' %}">← Voltar para a página inicial</a>

{% endblock %}
