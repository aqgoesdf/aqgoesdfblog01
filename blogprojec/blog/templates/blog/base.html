{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
    

</head>
<body>
    <header>
        <h1>Meu Blog</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>@ 2026 - Meu Blog</p>
    </footer>
</body>
</html>
